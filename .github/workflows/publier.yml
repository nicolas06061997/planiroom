# Publie l'appli sur GitHub Pages (comme l'appli Céline).
# Adresse : https://<compte>.github.io/planiroom/
# Lancement à la main (onglet Actions → « Publier l'appli » → Run workflow),
# sur la branche autorisée par l'environnement github-pages.
name: Publier l'appli

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Réglages facultatifs (Settings → Secrets and variables → Actions → Variables)
          NEXT_PUBLIC_FIREBASE_URL: ${{ vars.FIREBASE_URL }}
          NEXT_PUBLIC_CODE_HOTEL: ${{ vars.CODE_HOTEL }}
          NEXT_PUBLIC_LECTURE_URL: ${{ vars.LECTURE_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
